    <script>




$(document).ready(function(){

$("#myForm").validate({

    rules:{

        username:{
            required:true,
            minlength: 5,
            maxlength:9
        },
     
        password:{
            required:true,
            minlength: 8,
           
        }

    },

    messages:{

        username:{
                required:"Ito ay dapat may laman MALIIII ITOOOOOO:(",
                minlength: "Dapat 6 characters",
                maxlength:"Bawal lumampas sa 9 characters"
            }
           

        }




});

});













        const maxAttempts = 5;
        let attempts = 0;







// username and password for validation
const validUsername = "emmanuel";
const validPassword = "PAssword123";



// Function to check if the password has at least 2 capital letters
function hasTwoCapitalLetters(password) {
    let capitalCount = 0;
    
    // Loop through each character in the password
    for (let i = 0; i < password.length; i++) {
        if (password[i] >= 'A' && password[i] <= 'Z') {
            capitalCount++;
        }
        
        // If we already have 2 capital letters, we can stop
        if (capitalCount >= 2) {
            return true;
        }
    }
    
    // Return false if fewer than 2 capital letters were found
    return false;
}




document.getElementById("submitBtn").onclick = function(){
   
    event.preventDefault();
 

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const errorMessage = document.getElementById("errorMessage");
    const submitBtn = document.getElementById("submitBtn");

    if (username.length < 8) {
        errorMessage.textContent = "Username must be at least 8 characters long.";
        return;
    }


    if (!hasTwoCapitalLetters(password)) {
        errorMessage.textContent = "Password must contain at least 2 capital letters.";
        return;
    }


    // Check if username and password match
    if (username === validUsername && password === validPassword) {
        errorMessage.textContent = "";
        window.location.href = "index.html";  // Redirect to next page
    } else {
        attempts++;
        errorMessage.textContent = `Invalid credentials. Attempts remaining: ${maxAttempts - attempts}`;
        
        // Disable the submit button after 5 failed attempts
        if (attempts >= maxAttempts) {
            submitBtn.disabled = true;
            errorMessage.textContent = "Maximum attempts reached. Login disabled.";
        }
    }
};



document.addEventListener('keydown', e => {
  if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key))) {
    e.preventDefault(); 
  }
});
document.addEventListener('contextmenu', e => e.preventDefault());

    </script>
