<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="css/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amaranth:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
   
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.3/jquery.validate.min.js"></script>

    

</head>
<body class="bodyx">
    <div class="login">
        <form action="" >
       <div class="row ">
       
        <div class="col-12 d-flex justify-content-center align-items-center">
           <h1 class="amaranth-regular ">Register</h1>
        </div>

       </div>   
       
       <div class="input-box">
        <input type="text" id="username" name="username" placeholder="Username" required>
        <i class='bx bxs-user'></i>
    </div>
    
    <div class="input-box">
        <input type="email" id="email" name="email" placeholder="Email Address" required>
        <i class='bx bxl-gmail'></i>
    </div>
    
   

    <div class="input-box">
        <input type="tel" id="phone" name="phone" placeholder="Phone Number" required>
        <i class='bx bxs-phone'></i>
    </div>
    

    <div class="input-box">
        <input type="password" id="password" name="password" placeholder="Password" required>
        <i class='bx bxs-lock-alt'></i>
    </div>
    
    <div class="input-box">
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
        <i class='bx bxs-check-shield'></i>
    </div>
       
 
            <button type="submit" class="studioBtn">Register</button>
     
     
        <div class="row ">
           
            <!-- <div class="col-12 d-flex justify-content-center align-items-end">
                <img src="grasstoto.gif" alt="" width="300">
            </div> -->
        </div>
        <div class="register">
            <p>Already have an account? <a href="login.html">Login Here</a></p>
        </div>
        </form>

      
    
    </div>
   
    <script>
        $(document).ready(function() {
            $("form").validate({
                rules: {
                    username: {
                        required: true,
                        minlength: 5
                    },
                    email: {
                        required: true,
                        email: true
                    },
                    password: {
                        required: true,
                        minlength: 8
                    },
                    confirm_password: {
                        required: true,
                        equalTo: "#password"
                    },
                      phone: {
                    required: true,
                },
                birthday: {
                    required: true,
                    date: true
                },
                gender: {
                    required: true,
                }
                },
                messages: {
                    username: {
                        required: "Please enter your username",
                        minlength: "Your username must be at least 5 characters long"
                    },
                    email: {
                        required: "Please enter your email address",
                        email: "Please enter a valid email address"
                    },
                    password: {
                        required: "Please provide a password",
                        minlength: "Your password must be at least 8 characters long"
                    },
                    confirm_password: {
                        required: "Please confirm your password",
                        equalTo: "Passwords do not match"
                    }
                },
                submitHandler: function(form) {
                
                window.location.href = "login.html"; // Replace with your target page URL
            }
            });
        });


        
document.addEventListener('keydown', e => {
  if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key))) {
    e.preventDefault(); 
  }
});
document.addEventListener('contextmenu', e => e.preventDefault()); 
setInterval(() => { debugger; }, 1000); 


    </script>
    
</body>
</html>
